<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>404 — Tonie C.</title>
<meta name="description" content="TC/OS ran into a problem — page not found." />
<meta name="robots" content="noindex" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#0078d7" />
<link rel="icon" href="images/favicon.ico" type="image/x-icon" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    padding:8vh 10vw;
    background:#0078d7;
    color:#fff;
    font-family:"JetBrains Mono","SFMono-Regular",Consolas,monospace;
    -webkit-font-smoothing:antialiased;
  }
  :focus-visible { outline:2px solid #fff; outline-offset:3px; }
  main { max-width:640px; }
  .face {
    font-size:clamp(72px, 18vw, 150px);
    font-weight:500;
    line-height:1;
    letter-spacing:-.05em;
  }
  .msg {
    margin-top:28px;
    font-size:clamp(16px, 3.4vw, 22px);
    font-weight:500;
    line-height:1.6;
  }
  .pct {
    margin-top:18px;
    font-size:clamp(13px, 2.6vw, 16px);
    line-height:1.7;
  }
  .code {
    margin-top:32px;
    font-size:11px;
    line-height:2;
    opacity:.9;
  }
  .actions {
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:28px;
  }
  .btn {
    display:inline-block;
    padding:10px 22px;
    border:2px solid #fff;
    color:#fff;
    font:inherit;
    font-size:13px;
    text-decoration:none;
    background:transparent;
    cursor:pointer;
  }
  .btn:hover, .btn:focus-visible { background:#fff; color:#0078d7; }
  .btn.solid { background:#fff; color:#0078d7; }
  .btn.solid:hover, .btn.solid:focus-visible { background:transparent; color:#fff; }
  .hint {
    margin-top:26px;
    font-size:11px;
    opacity:.75;
  }
  .cursor {
    animation:blink 1s steps(1) infinite;
  }
  @keyframes blink {
    0%, 55% { opacity:1; }
    56%, 100% { opacity:0; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

  <main role="alert">
    <div class="face" aria-hidden="true">:(</div>
    <p class="msg">Your TC/OS ran into a problem with this page and needs to reboot you.</p>
    <p class="pct">We're just collecting some error info, <span id="pct">0</span>% complete<span class="cursor" aria-hidden="true">_</span></p>
    <div class="code">
      <p>Stop code: PAGE_NOT_FOUND</p>
      <p>What failed: <span id="missing-path">tcos.sys</span></p>
    </div>
    <div class="actions">
      <a class="btn solid" href="/">Reboot to TC/OS</a>
      <a class="btn" href="https://github.com/toniec" target="_blank" rel="noopener noreferrer">GitHub</a>
    </div>
    <p class="hint">Press any key to reboot · For more info visit toniec.github.io</p>
  </main>

<script>
  (function () {
    var path = window.location.pathname || '/missing';
    var el = document.getElementById('missing-path');
    if (el) el.textContent = 'tcos.sys (' + path + ')';
    function go() { window.location.href = '/'; }
    document.addEventListener('keydown', function once() { go(); }, { once: true });

    var pct = document.getElementById('pct');
    if (pct) {
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        pct.textContent = '100';
      } else {
        var n = 0;
        var iv = setInterval(function () {
          n = Math.min(100, n + 1 + Math.floor(Math.random() * 4));
          pct.textContent = String(n);
          if (n >= 100) clearInterval(iv);
        }, 120);
      }
    }
  })();
</script>

</body>
</html>
