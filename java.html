<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Attempts Demo — while vs for</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600&display=swap');

  :root {
    --bg: #0B0F0E;
    --panel: #141C19;
    --panel-border: #2C3A35;
    --hairline: #22302B;
    --text-primary: #E8EDEA;
    --text-muted: #7C9089;
    --mint: #5EE6A8;
    --mint-dim: #2E5943;
    --danger: #FF6B5E;
    --danger-dim: #5A2E29;
    --focus: #8FD8FF;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text-primary);
    margin: 0;
    padding: 56px 24px 80px;
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 15% 10%, rgba(94,230,168,0.05), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(255,107,94,0.04), transparent 45%);
  }

  .page-head {
    max-width: 880px;
    margin: 0 auto 48px;
    text-align: center;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--mint);
    margin: 0 0 14px;
    opacity: 0;
    animation: fade-up 0.5s ease-out 0.05s forwards;
  }

  h1 {
    font-family: var(--mono);
    font-weight: 800;
    font-size: clamp(28px, 4.2vw, 42px);
    letter-spacing: -0.01em;
    margin: 0 0 12px;
    opacity: 0;
    animation: fade-up 0.5s ease-out 0.12s forwards;
  }

  .subhead {
    font-family: var(--sans);
    color: var(--text-muted);
    font-size: 15px;
    line-height: 1.6;
    max-width: 560px;
    margin: 0 auto;
    opacity: 0;
    animation: fade-up 0.5s ease-out 0.2s forwards;
  }

  .subhead code {
    font-family: var(--mono);
    background: var(--panel);
    border: 1px solid var(--panel-border);
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 13px;
    color: var(--mint);
  }

  .stage {
    display: flex;
    flex-wrap: wrap;
    gap: 28px;
    justify-content: center;
    max-width: 900px;
    margin: 0 auto;
    align-items: flex-start;
  }

  /* --- Terminal panel --- */
  .box {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    width: 340px;
    overflow: hidden;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.2), 0 24px 48px -24px rgba(0,0,0,0.6);
    opacity: 0;
    transform: translateY(10px);
    animation: fade-up 0.55s ease-out forwards;
    transition: opacity 0.6s ease, transform 0.6s ease, filter 0.6s ease;
  }

  .box[data-side="while"] { animation-delay: 0.3s; }
  .box[data-side="for"]   { animation-delay: 0.42s; }

  .box.is-shutting-down {
    filter: saturate(0.3) brightness(0.85);
  }

  .box.is-gone {
    opacity: 0;
    transform: translateY(6px) scale(0.98);
    pointer-events: none;
  }

  .titlebar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: #0F1613;
    border-bottom: 1px solid var(--hairline);
  }

  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--hairline);
  }
  .dot.red { background: #4A3532; }
  .dot.amber { background: #4A4432; }
  .dot.green { background: #32402E; }

  .filename {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-muted);
    margin-left: 4px;
    letter-spacing: 0.01em;
  }

  .badge {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 3px 7px;
    border-radius: 4px;
    border: 1px solid var(--mint-dim);
    color: var(--mint);
  }

  .panel-body {
    padding: 22px 20px 24px;
  }

  h2 {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 700;
    margin: 0 0 4px;
    color: var(--text-primary);
  }

  .loop-hint {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
    margin: 0 0 18px;
  }

  label.field-label {
    display: block;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 0 0 6px;
    text-align: left;
  }

  .field-group {
    margin-bottom: 14px;
  }

  input {
    width: 100%;
    background: #0F1613;
    border: 1px solid var(--panel-border);
    color: var(--text-primary);
    font-family: var(--mono);
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 6px;
    margin: 0;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  input::placeholder { color: #4B5A54; }

  input:focus {
    outline: none;
    border-color: var(--focus);
    box-shadow: 0 0 0 3px rgba(143, 216, 255, 0.15);
  }

  input:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  button.run-btn {
    width: 100%;
    margin-top: 8px;
    background: var(--mint);
    color: #06120D;
    border: none;
    font-family: var(--mono);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.02em;
    padding: 11px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.12s ease, opacity 0.12s ease;
  }

  button.run-btn:hover:not(:disabled) {
    background: #77F0BA;
    transform: translateY(-1px);
  }

  button.run-btn:active:not(:disabled) {
    transform: translateY(0);
  }

  button.run-btn:disabled {
    background: var(--mint-dim);
    color: #587B6C;
    cursor: not-allowed;
  }

  button.run-btn:focus-visible,
  input:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .attempts-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 14px 0 4px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
  }

  .pips {
    display: flex;
    gap: 5px;
  }

  .pip {
    width: 14px;
    height: 6px;
    border-radius: 2px;
    background: var(--mint-dim);
    transition: background 0.25s ease;
  }

  .pip.spent {
    background: var(--danger-dim);
  }

  p.msg {
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.6;
    min-height: 18px;
    margin: 12px 0 0;
    text-align: left;
  }

  p.msg.msg-success { color: var(--mint); }
  p.msg.msg-error { color: var(--danger); }
  p.msg.msg-countdown {
    color: var(--danger);
    font-weight: 700;
    letter-spacing: 0.03em;
  }

  /* --- Residual / terminated state left behind after the box is removed --- */
  .residue {
    font-family: var(--mono);
    font-size: 12px;
    color: #495650;
    width: 340px;
    text-align: center;
    padding: 26px 18px;
    border: 1px dashed #2A3733;
    border-radius: 10px;
    opacity: 0;
    animation: fade-up 0.5s ease-out forwards;
  }

  .residue .residue-title {
    color: var(--danger);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-size: 11px;
    display: block;
    margin-bottom: 6px;
  }

  @keyframes fade-up {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .box, .eyebrow, h1, .subhead, .residue {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
    .box { transition: none; }
  }

  @media (max-width: 720px) {
    .stage { gap: 20px; }
    .box, .residue { width: 100%; max-width: 340px; }
  }
</style>
</head>
<body>

<div class="page-head">
  <h1>Login System</h1>
</div>

<div class="stage" id="stage">

  <div class="box" data-side="while" id="whileBox">
    <div class="titlebar">
      <span class="dot red"></span>
      <span class="dot amber"></span>
      <span class="dot green"></span>
      <span class="filename">while_version.js</span>
      <span class="badge">live</span>
    </div>
    <div class="panel-body">
      <h2>WHILE Version</h2>
      <p class="loop-hint">while (attempts &gt; 0) { … }</p>

      <div class="field-group">
        <label class="field-label" for="wUser">Username</label>
        <input type="text" id="wUser" placeholder="admin">
      </div>
      <div class="field-group">
        <label class="field-label" for="wPass">Password</label>
        <input type="password" id="wPass" placeholder="••••">
      </div>

      <button class="run-btn" id="wBtn" onclick="loginWhile()">Login</button>

      <div class="attempts-row">
        <span>Attempts</span>
        <div class="pips" id="wPips">
          <span class="pip" data-i="0"></span>
          <span class="pip" data-i="1"></span>
          <span class="pip" data-i="2"></span>
        </div>
      </div>

      <p id="wMsg" class="msg"></p>
    </div>
  </div>

  <!-- FOR VERSION -->
  <div class="box" data-side="for" id="forBox">
    <div class="titlebar">
      <span class="dot red"></span>
      <span class="dot amber"></span>
      <span class="dot green"></span>
      <span class="filename">for_version.js</span>
      <span class="badge">live</span>
    </div>
    <div class="panel-body">
      <h2>FOR Version</h2>
      <p class="loop-hint">for (let i = attempts; i &gt; 0; i--)</p>

      <div class="field-group">
        <label class="field-label" for="fUser">Username</label>
        <input type="text" id="fUser" placeholder="admin">
      </div>
      <div class="field-group">
        <label class="field-label" for="fPass">Password</label>
        <input type="password" id="fPass" placeholder="••••">
      </div>

      <button class="run-btn" id="fBtn" onclick="loginFor()">Login</button>

      <div class="attempts-row">
        <span>Attempts</span>
        <div class="pips" id="fPips">
          <span class="pip" data-i="0"></span>
          <span class="pip" data-i="1"></span>
          <span class="pip" data-i="2"></span>
        </div>
      </div>

      <p id="fMsg" class="msg"></p>
    </div>
  </div>

</div>

<script>
const correctUser = "admin";
const correctPass = "1234";
const MAX_ATTEMPTS = 3;

// WHILE VERSION STATE
let wAttempts = MAX_ATTEMPTS;

// FOR VERSION STATE
let fAttempts = MAX_ATTEMPTS;

function updatePips(pipsId, remaining) {
  const pips = document.querySelectorAll('#' + pipsId + ' .pip');
  pips.forEach((pip, idx) => {
    // spend pips from the right as attempts are used
    pip.classList.toggle('spent', idx >= remaining);
  });
}

function setMsg(el, text, kind) {
  el.textContent = text;
  el.classList.remove('msg-success', 'msg-error', 'msg-countdown');
  if (kind) el.classList.add(kind);
}

// WHILE LOGIN
function loginWhile() {
  let user = document.getElementById("wUser").value;
  let pass = document.getElementById("wPass").value;
  let msg = document.getElementById("wMsg");

  if (wAttempts <= 0) return;

  if (user === correctUser && pass === correctPass) {
    setMsg(msg, "Login successful.", "msg-success");
    return;
  } else {
    wAttempts--;
    updatePips('wPips', wAttempts);
    setMsg(msg, "Wrong credentials. Attempts left: " + wAttempts, "msg-error");
  }

  if (wAttempts === 0) {
    lockdown('whileBox', msg, 'wUser', 'wPass', 'wBtn');
  }
}

// FOR LOGIN (simulated FOR logic)
function loginFor() {
  let user = document.getElementById("fUser").value;
  let pass = document.getElementById("fPass").value;
  let msg = document.getElementById("fMsg");

  if (fAttempts <= 0) return;

  if (user === correctUser && pass === correctPass) {
    setMsg(msg, "Login successful.", "msg-success");
    return;
  } else {
    fAttempts--;
    updatePips('fPips', fAttempts);
    setMsg(msg, "Wrong credentials. Attempts left: " + fAttempts, "msg-error");
  }

  if (fAttempts === 0) {
    lockdown('forBox', msg, 'fUser', 'fPass', 'fBtn');
  }
}

// LOCKDOWN: disables inputs, counts down, then removes the box entirely
// and leaves a small residual marker behind in its place.
function lockdown(boxId, msgEl, userInputId, passInputId, btnId) {
  const box = document.getElementById(boxId);
  const filename = box.querySelector('.filename').textContent;

  document.getElementById(userInputId).disabled = true;
  document.getElementById(passInputId).disabled = true;
  document.getElementById(btnId).disabled = true;
  box.classList.add('is-shutting-down');

  let i = 10;
  setMsg(msgEl, "Exiting in: " + i, "msg-countdown");

  let interval = setInterval(() => {
    i--;
    if (i >= 0) {
      setMsg(msgEl, "Exiting in: " + i, "msg-countdown");
    }

    if (i < 0) {
      clearInterval(interval);
      removeBox(box, filename);
    }
  }, 1000);
}

function removeBox(box, filename) {
  box.classList.add('is-gone');

  const residue = document.createElement('div');
  residue.className = 'residue';
  residue.innerHTML =
    '<span class="residue-title">Process terminated</span>' +
    filename + ' — session closed after 3 failed attempts.';

  box.addEventListener('transitionend', function handler() {
    box.removeEventListener('transitionend', handler);
    box.replaceWith(residue);
  }, { once: true });

  // fallback in case transitionend doesn't fire
  setTimeout(() => {
    if (box.isConnected) box.replaceWith(residue);
  }, 700);
}
</script>

</body>
</html>
